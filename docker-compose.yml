# Docker Compose - Infraestrutura do Pipeline de Evidencias Explicativas
#
# Servicos:
#   - mysql: banco de dados relacional (porta 3307)
#   - qdrant: banco vetorial para embeddings (portas 6333, 6334)
#   - minio: armazenamento de objetos S3-compatible (portas 9000, 9001)
#   - pipeline: container principal que executa o benchmark

services:
  # Banco de Dados Relacional - MySQL 8.0
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: evidence_db
      MYSQL_USER: evidence_user
      MYSQL_PASSWORD: evidence_pass
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - 3307:3306  # Porta externa 3307 para evitar conflito com MySQL local
    volumes:
      - mysql_data:/var/lib/mysql

  # Banco Vetorial - Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - 6333:6333  # API HTTP
      - 6334:6334  # API gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Armazenamento de Objetos - MinIO
  minio:
    image: minio/minio:latest
    user: root
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000  # API S3
      - 9001:9001  # Console web
    volumes:
      - minio_data:/data

  # Pipeline Principal - Executa o benchmark
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - qdrant
      - minio
    environment:
      DATABASE_DSN: mysql+pymysql://evidence_user:evidence_pass@mysql:3306/evidence_db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: image_embeddings
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: evidence-assets
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
      - torch_cache:/root/.cache/torch
    working_dir: /app
    command: python src/benchmark.py --input images/ --output reports/ --workers 1

# Volumes persistentes
volumes:
  mysql_data:
  qdrant_data:
  minio_data:
  torch_cache:
